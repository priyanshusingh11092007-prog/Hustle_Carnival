services:
  - type: web
    name: queuesathi
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: "flask --app run init-db && python scripts/seed_demo.py && gunicorn --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: queuesathi-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: queuesathi-db
    databaseName: queuesathi
    user: queuesathi
    plan: basic-256mb
