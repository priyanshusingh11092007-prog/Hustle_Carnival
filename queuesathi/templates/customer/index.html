{% extends "base.html" %}

{% block title %}
Select Service | QueueSathi
{% endblock %}

{% block content %}

<div class="page-heading">

    <h1>Select a Campus Service</h1>

    <p>
        Choose the service you want to join.
    </p>

</div>

<div class="service-grid">

    {% for service in services %}

    <div class="card service-card">

        <h2>
            {{ service['service_name'] }}
        </h2>

        <p>
            Generate your digital queue token.
        </p>

        <form
            method="POST"
            action="{{ url_for('customer.join_queue') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <input
                type="hidden"
                name="service_id"
                value="{{ service['id'] }}"
            >

            <button class="btn btn-primary">
                Get Token
            </button>

        </form>

    </div>

    {% endfor %}

</div>

{% endblock %}
